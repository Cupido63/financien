<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Financiën">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.png">
<meta name="theme-color" content="#13315c">
<title>Huishoudfinanciën</title>
<style>
:root{
  --b950:#071a33;--b900:#0b2545;--b800:#13315c;--b700:#1a4480;--b600:#1d5fbf;--b500:#3d7cc9;
  --b400:#5b8fd9;--b300:#93b8ea;--b200:#c4d8f3;--b100:#e8f0fb;--b50:#f4f7fc;
  --ink:#10213a;--muted:#5a6b85;--line:#dbe4f0;--warn:#b45309;--warnbg:#fff4e0;--ok:#11734b;--bad:#b42318;
  --card:#ffffff;--radius:14px;--shadow:0 1px 2px rgba(16,33,58,.06),0 4px 16px rgba(16,33,58,.06);
  --exp:#d9773a;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--b50);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100vh}
nav.side{background:linear-gradient(180deg,var(--b900),var(--b800));color:#fff;padding:20px 12px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{font-weight:700;font-size:17px;padding:4px 10px 18px;letter-spacing:.2px}
.brand small{display:block;font-weight:400;color:var(--b300);font-size:12px;margin-top:2px}
nav.side a{display:flex;align-items:center;gap:10px;color:var(--b200);text-decoration:none;padding:9px 12px;border-radius:10px;margin:2px 0;font-size:14.5px}
nav.side a:hover{background:rgba(255,255,255,.07);color:#fff}
nav.side a.on{background:var(--b600);color:#fff}
nav.side svg{width:18px;height:18px;flex:none}
main{padding:28px 32px 90px;max-width:1180px;width:100%}
h1{font-size:24px;margin:0 0 4px}
.sub{color:var(--muted);margin:0 0 22px}
h2{font-size:17px;margin:0 0 12px}
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px 20px;margin-bottom:18px}
.grid{display:grid;gap:16px}
.g4{grid-template-columns:repeat(4,1fr)}.g2{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(3,1fr)}
.tile{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px 18px;border-top:4px solid var(--b600)}
.tile .lbl{color:var(--muted);font-size:13px}
.tile .val{font-size:24px;font-weight:700;margin:4px 0 2px;font-variant-numeric:tabular-nums}
.tile .note{font-size:12.5px;color:var(--muted)}
.tile.alt{border-top-color:var(--b400)}.tile.alt2{border-top-color:var(--b300)}.tile.alt3{border-top-color:var(--b900)}
.warn{background:var(--warnbg);color:var(--warn);border-radius:10px;padding:8px 12px;font-size:13.5px;margin:8px 0}
.info{background:var(--b100);color:var(--b800);border-radius:10px;padding:10px 14px;font-size:13.5px;margin:8px 0 14px}
.btn{background:var(--b600);color:#fff;border:0;border-radius:10px;padding:8px 14px;cursor:pointer;font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:6px}
.btn:hover{background:var(--b700)}
.btn.sec{background:var(--b100);color:var(--b800)}.btn.sec:hover{background:var(--b200)}
.btn.ghost{background:transparent;color:var(--b600);padding:6px 8px}.btn.ghost:hover{background:var(--b100)}
.btn.danger{background:#fde8e6;color:var(--bad)}
.btn.sm{padding:5px 10px;font-size:13px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
th{color:var(--muted);font-weight:600;font-size:12.5px;text-transform:uppercase;letter-spacing:.3px;background:var(--b50)}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
tr.tot td{font-weight:700;border-top:2px solid var(--b200)}
.tablewrap{overflow-x:auto}
.badge{display:inline-block;font-size:11.5px;padding:2px 8px;border-radius:99px;background:var(--b100);color:var(--b700);font-weight:600;white-space:nowrap}
.badge.w{background:var(--warnbg);color:var(--warn)}.badge.g{background:#e3f4ec;color:var(--ok)}.badge.d{background:var(--b800);color:#fff}
.muted{color:var(--muted)}.small{font-size:12.5px}
.neg{color:var(--bad)}.pos{color:var(--ok)}
.acc{display:grid;grid-template-columns:1fr auto;gap:6px 16px;align-items:center}
.acc .nm{font-weight:650;font-size:16px}
.acc .v{font-size:22px;font-weight:700;text-align:right;font-variant-numeric:tabular-nums}
.chart{width:100%;overflow:hidden}
.chart svg{display:block;width:100%;height:auto}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin-top:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.cal{display:grid;gap:8px}
.cal .ev{display:flex;gap:12px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.cal .dt{width:74px;flex:none;font-weight:650;color:var(--b700);font-size:13px}
/* modal */
.ov{position:fixed;inset:0;background:rgba(7,26,51,.45);display:flex;align-items:flex-start;justify-content:center;padding:6vh 14px;z-index:50;overflow:auto}
.modal{background:#fff;border-radius:16px;box-shadow:0 20px 60px rgba(0,0,0,.25);width:100%;max-width:520px;padding:22px}
.modal h3{margin:0 0 14px;font-size:18px}
.f{margin-bottom:12px}
.f label{display:block;font-size:13px;font-weight:600;color:var(--b800);margin-bottom:4px}
.f input:not([type=checkbox]),.f select,.f textarea{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:9px;background:#fff}
.f input:focus,.f select:focus,.f textarea:focus{outline:2px solid var(--b300);border-color:var(--b500)}
.f .help{font-size:12px;color:var(--muted);margin-top:3px}
.f.cb label{display:flex;gap:8px;align-items:center;font-weight:500}
.err{color:var(--bad);font-size:13px;margin:4px 0}
.actions{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
.toggle{display:inline-flex;background:var(--b100);border-radius:10px;padding:3px}
.toggle button{border:0;background:transparent;padding:6px 12px;border-radius:8px;cursor:pointer;font-size:13.5px;color:var(--b800)}
.toggle button.on{background:#fff;box-shadow:var(--shadow);font-weight:600}
input.cell{width:76px;padding:4px 6px;border:1px solid var(--line);border-radius:6px;text-align:right}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--b900);color:#fff;padding:10px 18px;border-radius:10px;z-index:60;font-size:14px;box-shadow:var(--shadow)}
input.gcell{width:120px;padding:6px 8px;border:1px solid var(--line);border-radius:7px;text-align:right;background:#fff}
input.gcell:focus{outline:2px solid var(--b300);border-color:var(--b500)}
input.gcell:disabled,input.gcell[data-calc]{background:var(--b50);color:var(--b800);font-weight:600;border-style:dashed}
tr.gcat td{background:#fff}tr.gtot td,tr.gtot th{background:var(--b100)!important;border-bottom:2px solid var(--b200)}tr.gsub td{border-bottom-color:#eef2f8;padding-top:5px;padding-bottom:5px}
.mstrip{display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.mchip{border:1px solid var(--b200);background:#fff;color:var(--b700);border-radius:7px;padding:3px 7px;font-size:12px;cursor:pointer;min-width:38px}
.mchip.f{background:var(--b700);color:#fff;border-color:var(--b700)}
.ywrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
.ytab{border-collapse:separate;border-spacing:0;font-size:13px;width:100%;min-width:940px}
.ytab th,.ytab td{padding:3px 3px;border-bottom:1px solid #eef2f8;white-space:nowrap}
.ytab thead th{position:sticky;top:0;background:var(--b50);text-align:center;font-size:12px;z-index:1;text-transform:none;letter-spacing:0;color:var(--b700)}
.ytab thead th a{color:var(--b700);text-decoration:none;font-weight:700;text-transform:capitalize}
.ytab thead th.ynow{background:var(--b100)}
.ytab .yname{position:sticky;left:0;background:#fff;text-align:left;font-weight:600;min-width:140px;max-width:150px;width:150px;overflow:hidden;text-overflow:ellipsis;z-index:2;text-transform:none;letter-spacing:0;color:var(--ink);font-size:13px}
.ytab thead .yname{background:var(--b50);z-index:3}
.ytab .yname.sub{font-weight:400;color:var(--muted);padding-left:30px}
.ytab td{position:relative}
.ytab input.yc{width:100%;min-width:52px;padding:4px 5px;font-size:12.5px;border-radius:6px}
.ytab tr.gsub input.yc{background:#fbfcfe}
.ytab .ytot{font-weight:700;padding-right:10px}
.ytab tfoot th,.ytab tfoot td{border-top:2px solid var(--b200);font-weight:700;background:var(--b50);padding:7px 6px}
.ldot{position:absolute;top:5px;right:7px;width:6px;height:6px;border-radius:50%;background:var(--b500)}
.lgroups{flex-direction:column;gap:10px}.lhead{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.lhead b{font-size:13.5px}.pdates{font-size:12px;color:var(--b800)}.pdates.muted{color:var(--muted)}.litems{display:flex;gap:14px;flex-wrap:wrap;margin-top:3px}.lgrp{display:block}.lgrp b{color:var(--ink)}
.mp{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.mp-y{display:flex;gap:4px;align-items:center}
.mpYear{padding:5px 8px;border:1px solid var(--line);border-radius:8px;font-weight:700;color:var(--b800);background:#fff}
.mp-m{display:grid;grid-template-columns:repeat(12,1fr);gap:4px;flex:1;min-width:280px}
.mp .mchip{min-width:0;padding:7px 0;font-size:13px}
.mchip.fut{border-style:dashed}
.mchip.now{box-shadow:inset 0 -3px 0 var(--b400)}
@media (max-width:900px){ .mp-m{grid-template-columns:repeat(6,1fr);min-width:100%} }
.mchip.on{outline:3px solid var(--b300);outline-offset:1px;font-weight:700}
input.catname{padding:7px 10px;border:1px solid var(--line);border-radius:8px;font-weight:600;min-width:200px;flex:1;max-width:320px}
input.catname:focus,input.subname:focus,input.subnew:focus{outline:2px solid var(--b300);border-color:var(--b500)}
.cathead{flex-wrap:nowrap}.cathead input.catname{min-width:0}
.catbox{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px;background:#fff}
.catnr{width:22px;height:22px;border-radius:50%;background:var(--b100);color:var(--b700);font-size:12px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;flex:none}
.subs{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 0 30px;align-items:center}
.subchip{display:inline-flex;align-items:center;background:var(--b100);border-radius:99px;padding:2px 4px 2px 10px}
.subchip input{border:0;background:transparent;font-size:13px;color:var(--b800);padding:3px 0;min-width:40px}
.subchip button{border:0;background:transparent;color:var(--b600);cursor:pointer;font-size:12px;padding:2px 6px;border-radius:99px}
.subchip button:hover{background:var(--b200)}
.subadd{display:inline-flex;gap:4px;align-items:center}
.subadd input{border:1px dashed var(--b300);border-radius:99px;padding:4px 10px;font-size:13px}
button[disabled]{opacity:.3;cursor:default}
@media (max-width:900px){ .catgrid{grid-template-columns:1fr!important} input.catname{min-width:120px} .subs{margin-left:0} }
#tip{white-space:pre-line;position:fixed;z-index:70;pointer-events:none;background:var(--b950);color:#fff;font-size:12.5px;padding:6px 10px;border-radius:8px;box-shadow:0 6px 20px rgba(0,0,0,.2);max-width:320px;display:none}
.rank{display:block}.rank .rk{margin-bottom:2px}
.rk{display:grid;grid-template-columns:minmax(110px,34%) 1fr 124px;gap:10px;align-items:center;padding:6px 6px;border-radius:8px;cursor:pointer}
.rk:hover,.rk.foc{background:var(--b100)}
.rk-l{font-weight:600;font-size:14px;display:flex;align-items:center;gap:8px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rk-l i,.sw{width:10px;height:10px;border-radius:3px;flex:none;display:inline-block;margin-right:6px}
.rk-b{height:14px;background:var(--b50);border-radius:4px;overflow:hidden}
.rk-f{height:100%;background:var(--b600);border-radius:0 4px 4px 0;min-width:2px}
.rk-v{text-align:right;font-variant-numeric:tabular-nums;font-weight:650;font-size:14px;white-space:nowrap}
.rk-v span{display:inline-block;width:54px;color:var(--muted);font-weight:500;font-size:12px}
.anside{position:sticky;top:16px;align-self:start}
.rk.sub{cursor:default;padding-top:2px;padding-bottom:2px}.rk.sub:hover{background:transparent}
.rk.sub .rk-l{font-weight:400;font-size:13px;color:var(--muted);padding-left:18px}
.rk.sub .rk-b{height:8px}.rk.sub .rk-f{background:var(--b300)}
.rk.sub .rk-v{font-weight:400;font-size:13px;color:var(--muted)}
@media (max-width:900px){ .angrid{grid-template-columns:1fr!important} .anside{position:static} .rk{grid-template-columns:40% 1fr 92px} }
details summary{cursor:pointer;color:var(--b600);font-size:13.5px;margin-top:8px}
@media (max-width:900px){
  .app{grid-template-columns:minmax(0,1fr)}
  nav.side{position:fixed;bottom:0;top:auto;left:0;right:0;height:auto;padding:6px 6px calc(6px + env(safe-area-inset-bottom));display:flex;overflow-x:auto;z-index:40;gap:2px}
  .brand{display:none}
  nav.side a{flex-direction:column;gap:2px;font-size:10.5px;padding:6px 8px;min-width:64px;text-align:center;margin:0}
  main{padding:18px 14px 110px}
  .g4{grid-template-columns:repeat(2,1fr)}.g2,.g3{grid-template-columns:1fr}
  .tile .val{font-size:20px}
}
.sync{font-weight:600}.sync.ok{color:var(--ok)}.sync.fout{color:var(--bad)}.sync.lokaal,.sync.traag{color:var(--warn)}
.pwrap{display:flex;flex-direction:column;gap:16px;align-items:center}.plegs{width:100%;display:flex;flex-direction:column;gap:4px;font-size:13px}
.pleg{display:grid;grid-template-columns:12px minmax(0,1fr) auto 44px;gap:8px;align-items:center;padding:3px 6px;border-radius:7px}.pleg:hover{background:var(--b50)}.pleg i{width:10px;height:10px;border-radius:3px;display:inline-block}.pleg b{font-variant-numeric:tabular-nums}.pleg .pname{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.pleg .muted{text-align:right;font-size:12px}
tr.ysum td,tr.ysum th{background:var(--b100)!important;border-bottom:2px solid var(--b200)}
.accgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;align-items:start}
.acccol{display:flex;flex-direction:column;gap:12px;min-width:0}.acchead{font-size:12.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;margin:2px 2px -4px}
.accgrid .acard{margin:0;padding:12px 14px}
.acard .nm{font-size:15px}.acard .v{font-size:18px}
.acard .row{margin-top:8px!important;gap:4px}.acard .btn.sm{padding:4px 8px;font-size:12.5px}
.acard .badge{font-size:10.5px;padding:1px 6px}
@media (max-width:900px){ .accgrid{grid-template-columns:minmax(0,1fr)} }
.ktab th,.ktab td{white-space:nowrap}.ktab th.kpast{background:#eef1f5;color:#5a6b85}.ktab th.yname{min-width:200px;max-width:none}.ktab{width:auto;min-width:0}.ktab td.n,.ktab thead th{min-width:86px}.ktab td.n{padding:6px 8px;font-size:13px}
.helpbtn{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;border-radius:50%;border:0;background:var(--b100);color:var(--b700);font-weight:700;font-size:14px;cursor:pointer;vertical-align:middle;margin-left:6px}.helpbtn:hover{background:var(--b200)}
.helpm{max-width:640px}.helptxt{font-size:14px;line-height:1.55}.helptxt p{margin:0 0 10px}.helptxt ul{margin:0 0 10px;padding-left:20px}.helptxt li{margin-bottom:4px}
.rtab td,.rtab th{padding:5px 10px}.rtab td:first-child{min-width:300px}.rtab td.amt,.rtab th.amt{white-space:nowrap;font-variant-numeric:tabular-nums;padding-right:4px}.rtab td.aux,.rtab th.aux{white-space:nowrap;color:var(--muted);font-size:12px;padding-left:4px;padding-right:16px;font-variant-numeric:tabular-nums}.rtab tr.muted td{color:var(--muted)}.rtab tr.keyrow td{background:var(--b100);font-size:15px}.rtab td.amt,.rtab th.amt{border-left:1px solid var(--line)}.rtab th[colspan]{border-left:1px solid var(--line)}
</style>
</head>
<body>
<div class="app">
  <nav class="side" id="nav"></nav>
  <main id="main"></main>
</div>
<div id="modalRoot"></div>
<div id="tip"></div>
<script>
"use strict";
/* ============ Hulpfuncties ============ */
const $ = s => document.querySelector(s);
const eur = new Intl.NumberFormat('nl-NL',{style:'currency',currency:'EUR',maximumFractionDigits:0});
const eur2 = new Intl.NumberFormat('nl-NL',{style:'currency',currency:'EUR',minimumFractionDigits:2,maximumFractionDigits:2});
const eurC = new Intl.NumberFormat('nl-NL',{style:'currency',currency:'EUR',notation:'compact',maximumFractionDigits:1});
const E = v => v==null||isNaN(v) ? '–' : eur.format(v);
const E2 = v => v==null||isNaN(v) ? '–' : eur2.format(v);
const P = v => v==null||isNaN(v) ? '–' : (v*100).toFixed(1).replace('.',',')+'%';
const uid = () => Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-5);
const pad = n => String(n).padStart(2,'0');
const todayStr = () => {const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());};
const curYm = () => todayStr().slice(0,7);
const curY = () => +todayStr().slice(0,4);
const ymI = ym => {const [y,m]=ym.split('-').map(Number);return y*12+m-1;};
const iYm = i => Math.floor(i/12)+'-'+pad(i%12+1);
const lastDay = ym => ym+'-'+pad(new Date(+ym.slice(0,4), +ym.slice(5,7), 0).getDate());
const mName = ym => new Date(+ym.slice(0,4), +ym.slice(5,7)-1, 15).toLocaleDateString('nl-NL',{month:'short',year:'2-digit'});
const mLong = ym => new Date(+ym.slice(0,4), +ym.slice(5,7)-1, 15).toLocaleDateString('nl-NL',{month:'long',year:'numeric'});
const dNl = d => d ? new Date(d+'T12:00').toLocaleDateString('nl-NL',{day:'numeric',month:'short',year:'numeric'}) : '';
const esc = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const sum = a => a.reduce((s,x)=>s+(+x||0),0);
function parseNum(s){
  if(s==null) return NaN; s=String(s).trim().replace(/[€\s]/g,''); if(s==='') return NaN;
  if(s.includes(',')) s=s.replace(/\./g,'').replace(',','.');
  else if(/^-?\d{1,3}(\.\d{3})+$/.test(s)) s=s.replace(/\./g,'');
  return parseFloat(s);
}
/* Nederlandse datuminvoer: dd-mm-jjjj en mm-jjjj */
const isoToNl = d => isDateS(d) ? d.slice(8)+'-'+d.slice(5,7)+'-'+d.slice(0,4) : '';
const ymToNl = ym => /^\d{4}-\d{2}$/.test(ym||'') ? ym.slice(5)+'-'+ym.slice(0,4) : '';
function isDateS(d){ return /^\d{4}-\d{2}-\d{2}$/.test(d||''); }
function fixYear(y){ y=+y; return y<100 ? (y>40?1900+y:2000+y) : y; }
function nlToIso(s){ s=String(s||'').trim(); if(!s) return '';
  if(/^vandaag$/i.test(s)) return todayStr();
  let m=s.match(/^(\d{1,2})[-\/. ](\d{1,2})[-\/. ](\d{2}|\d{4})$/) || s.match(/^(\d{2})(\d{2})(\d{4}|\d{2})$/) || s.replace(/[^\d]/g,'').match(/^(\d{2})(\d{2})(\d{4})$/); if(!m) return null;
  const d=+m[1], mo=+m[2], y=fixYear(m[3]); const t=new Date(y,mo-1,d); if(t.getFullYear()!==y||t.getMonth()!==mo-1||t.getDate()!==d) return null;
  return y+'-'+pad(mo)+'-'+pad(d); }
function nlToYm(s){ s=String(s||'').trim(); if(!s) return '';
  let m=s.match(/^(\d{1,2})[-\/. ](\d{2}|\d{4})$/) || s.match(/^(\d{2})(\d{4})$/); if(!m) return null;
  const mo=+m[1], y=fixYear(m[2]); if(mo<1||mo>12) return null; return y+'-'+pad(mo); }

async function cbsGet(path){ const ctl=new AbortController(), to=setTimeout(()=>ctl.abort(),20000);

async function cbsTable(id, periods){

  const yoy=props.find(p=>p.Type==='Topic'&&/^jaarmutatie cpi/i.test(p.Title||'')&&!/afgeleid|constante/i.test(p.Title||''));
  const w=props.find(p=>p.Type==='Topic'&&/weging/i.test(p.Title||''));
  if(!yoy) throw new Error('Kolom jaarmutatie niet gevonden in CBS-tabel '+id);
  const codeOf={}; for(const c of cats){ const k=String(c.Key).trim(), m=String(c.Title||'').match(/^(\d{6})\s+(.*)$/); codeOf[k]=m?{code:m[1],t:m[2]}:{code:k,t:c.Title||k}; }
  let per=periods; if(typeof per==='function'){ const ps=(await cbsGet(id+'/Perioden')).map(p=>String(p.Key).trim()); per=per(ps); }

  const rows=await cbsGet(id+'/TypedDataSet?$filter='+encodeURIComponent(filt)+'&$select='+sel);
  return rows.map(r=>({...codeOf[String(r.Bestedingscategorieen).trim()]||{code:String(r.Bestedingscategorieen).trim(),t:''}, per:String(r.Perioden).trim(), yoy:r[yoy.Key], w:w?r[w.Key]:null}));

async function cpiFetch(manual){

    const cats={}, hist={}; let period='';
    for(const r of cur.sort((a,b)=>a.per<b.per?-1:1)){ if(!keep(r.code)||r.yoy==null) continue; cats[r.code]={t:r.t,yoy:+r.yoy,w:r.w!=null?+r.w:null,per:r.per}; (hist[r.code] ||= []).push(+r.yoy); if(r.per>period) period=r.per; }

function prognosis(){
  const cy=curY(); const st=monthStatus(curYm()); const base=expenseBase(); const baseM=sum(Object.values(base.cats));
  let v=st.total, infF=1, groF=1; const rows=[];
  /* Rest van het lopende jaar: volgende maand t/m december, plus losse uitgaven met een datum na vandaag in dit jaar */
  const cm=+curYm().slice(5,7), restM=12-cm; let rInc=0;
  for(let m=cm+1;m<=12;m++) for(const o of Object.values(expIncome(cy+'-'+pad(m)))) for(const x of Object.values(o)) rInc+=x;
  const rOne=sum(S.actuals.filter(a=>a.kind==='uit'&&!a.grid&&a.monthTotal==null&&a.date>todayStr()&&a.date.slice(0,4)===String(cy)).map(a=>+a.amount))
    + sum(S.expected.filter(e=>e.kind==='uit'&&e.ym>curYm()&&e.ym.slice(0,4)===String(cy)).map(e=>+e.amount));
  const fixNow=fixedNowAnnual(), rFix=restM?fixedInMonths(cy,cm+1,12)-fixNow*restM/12:0;
  const rExp=baseM*restM+rFix+rOne, rRet=v*(yp(cy).rend-S.settings.box3)/100*restM/12;
  const rest={months:restM,begin:v,inc:rInc,exp:rExp,oneOff:rOne,fix:rFix,ret:rRet,end:v+rRet+rInc-rExp};
  v=rest.end; const useCpi=cpiOn(), fnk=useCpi?fixNowByKey():null;
  for(let y=cy+1;y<=cy+30;y++){
    const p=yp(y); infF*=1+p.infl/100; groF*=1+p.growth/100;
    const incByCat={}, incByPerson={}, incByPC={}, decPC={}; let inc=0;
    for(let m=1;m<=12;m++){ for(const [c,o] of Object.entries(expIncome(y+'-'+pad(m)))) for(const [sb,v] of Object.entries(o)){
      const amt=v*groF; inc+=amt; incByCat[c]=(incByCat[c]||0)+amt; const pp=sb||'Samen (categorietotaal)'; incByPerson[pp]=(incByPerson[pp]||0)+amt; incByPC[pp+'|'+c]=(incByPC[pp+'|'+c]||0)+amt; if(m===12) decPC[pp+'|'+c]=(decPC[pp+'|'+c]||0)+amt; } }
    const inY=d=> d.slice(0,4)===String(y) && d>todayStr();
    const oneOff=sum(S.actuals.filter(a=>a.kind==='uit' && !a.grid && a.monthTotal==null && inY(a.date)).map(a=>+a.amount))
      + sum(S.expected.filter(e=>e.kind==='uit' && inY(lastDay(e.ym))).map(e=>+e.amount));
    const plan=sum(S.planned.filter(x=>+x.year===y).map(x=>x.amount))*infF + oneOff;
    const cpi=useCpi, fixAdj=cpi?cpiFixAdj(y,fnk):(fixedInMonths(y,1,12)-fixNow)*infF;
    const exp=Math.max(0,(cpi?cpiExpYear(y):baseM*12*infF)+fixAdj)+plan;
    const begin=v; const ret=begin*(p.rend-S.settings.box3)/100;
    v=begin+ret+inc-exp;
    rows.push({y,begin,inc,exp,plan,fixAdj,ret,end:v,infF,incByCat,incByPerson,incByPC,decPC,p});
  }
  return {rows,start:st,base,baseM,rest};
}
function yearRend(acc, y){
  const ov=S.histRend.find(h=>+h.year===+y && h.acc===acc.id);
  if(ov) return {pct:ov.pct/100, eur:null, base:null, manual:true};
  const t=TYPES[acc.type]; const ms=measOf(acc.id);
  const prevEnd=valueAt(acc.id,y+'-01-01'); const inYear=ms.filter(m=>m.date.slice(0,4)==String(y));
  const startM=prevEnd||inYear[0]; if(!startM) return null;
  if(t.waarde){
    const endM=valueAt(acc.id,(y+1)+'-01-01'); if(!endM||endM===startM) return null;
    const fl=sum(S.flows.filter(f=>f.acc===acc.id && f.date>startM.date && f.date<=endM.date).map(f=>f.amount));
    const e=endM.value-startM.value-fl; const basis=startM.value+Math.max(0,fl);
    return {eur:e, pct:basis>0?e/basis:null, base:basis, partial:endM.date.slice(0,4)==String(curY()) && y==curY(), from:startM.date, to:endM.date};
  }
  if(!hasRate(acc)) return null;
  let from=y+'-01-01'; const firstM=ms[0]; if(firstM.date>from) from=firstM.date; if(acc.start&&acc.start>from) from=acc.start;
  const to=(y+1)+'-01-01'; if(from>=to) return null;
  const ic=interestCalc(acc,from,to); if(!ic.avg) return null;
  const rec=S.interest.filter(x=>x.acc===acc.id&&x.date.slice(0,4)==String(y));
  if(rec.length){ const e=sum(rec.map(x=>x.amount)); const cur=y==curY();
    const el=cur?Math.max(1,daysBetween(from,todayStr())):ic.days;
    return {eur:e, pct:e/(ic.avg*el/365), base:ic.avg, received:true, partial:cur}; }
  return {eur:ic.eur, pct:ic.eur/(ic.avg*ic.days/365), base:ic.avg*ic.days/365, expected:y>=curY(), calc:true};
}
function totalRend(y){
  const ov=S.histRend.find(h=>+h.year===+y && !h.acc); if(ov) return {pct:ov.pct/100, eur:null, manual:true};
  let e=0,b=0,any=false;
  for(const a of S.accounts){ const r=yearRend(a,y); if(r && r.eur!=null && r.base){ e+=r.eur; b+=r.base; any=true; } }
  return any?{eur:e,pct:b?e/b:null}:null;
}

  for(const a of S.actuals){ if(!isInv(a)) continue; const e=ymI(a.date.slice(0,7))+(+a.months||1)-1; if(e>=c&&e<=until) ev.push({ym:iYm(e), txt:`Afschrijving klaar: ${a.note||a.cat}`, amt:a.amount/(+a.months||1), kind:'uit', badge:'afschrijving'}); }
  for(const e of S.expected){ const i=ymI(e.ym); if(i>=c&&i<=until) ev.push({ym:e.ym, txt:`Verwacht: ${e.note||e.cat}`, amt:e.amount, kind:e.kind, badge:'incidenteel'}); }
  const cy=curY(); for(const p of S.planned){ if(+p.year===cy||+p.year===cy+1) ev.push({ym:p.year+'-01', txt:`Geplande uitgave ${p.year}: ${p.name}`, amt:p.amount, kind:'uit', badge:'gepland', yearOnly:true}); }
  return ev.sort((a,b)=>a.ym<b.ym?-1:1);
}

/* ============ Grafieken (SVG) ============ */
function niceTicks(min,max,n=4){
  if(min===max){max=min+1;} const span=max-min, step0=span/n, mag=Math.pow(10,Math.floor(Math.log10(step0)));
  const step=[1,2,2.5,5,10].map(x=>x*mag).find(x=>x>=step0)||mag*10;
  const lo=Math.floor(min/step)*step, hi=Math.ceil(max/step)*step; const t=[]; for(let v=lo;v<=hi+step/2;v+=step) t.push(+v.toFixed(6)); return t;
}
function lineChart({labels,series,h=250,hollow=[]}){
  const W=760,H=h,pl=70,pr=14,pt=14,pb=30;
  const vals=series.flatMap(s=>s.values).filter(v=>v!=null);
  if(!vals.length) return '<p class="muted">Nog geen gegevens om te tonen.</p>';
  const ticks=niceTicks(Math.min(0,...vals),Math.max(...vals)); const lo=ticks[0],hi=ticks[ticks.length-1];
  const n=labels.length, x=i=>pl+(n<2?(W-pl-pr)/2:i*(W-pl-pr)/(n-1)), y=v=>pt+(H-pt-pb)*(1-(v-lo)/(hi-lo||1));
  let g='';
  for(const t of ticks) g+=`<line x1="${pl}" x2="${W-pr}" y1="${y(t)}" y2="${y(t)}" stroke="${t===0?'#b8c7dc':'#e6edf6'}"/><text x="${pl-8}" y="${y(t)+4}" text-anchor="end" font-size="11" fill="#5a6b85">${esc(eurC.format(t))}</text>`;
  const every=Math.ceil(n/12);
  labels.forEach((l,i)=>{ if(i%every===0||(i===n-1&&(n-1)%every>=every/2+0.5)||every===1) g+=`<text x="${x(i)}" y="${H-10}" text-anchor="middle" font-size="11" fill="#5a6b85">${esc(l)}</text>`; });
  for(const s of series){
    let d='',pen=false; s.values.forEach((v,i)=>{ if(v==null){pen=false;return;} d+=(pen?'L':'M')+x(i).toFixed(1)+' '+y(v).toFixed(1)+' '; pen=true; });
    g+=`<path d="${d}" fill="none" stroke="${s.color}" stroke-width="${s.width||2.5}" ${s.dash?'stroke-dasharray="5 4"':''} stroke-linejoin="round" stroke-linecap="round"/>`;
    if(n<=60) s.values.forEach((v,i)=>{ if(v==null) return; const ho=hollow.includes(i)&&s.markHollow;
      g+=`<circle cx="${x(i)}" cy="${y(v)}" r="${ho?4:3}" fill="${ho?'#fff':s.color}" stroke="${s.color}" stroke-width="2"><title>${esc(s.name)} · ${esc(labels[i])}: ${esc(E(v))}${ho?' (onvolledig)':''}</title></circle>`; });
  }
  const leg=series.map(s=>`<span><i style="background:${s.color}"></i>${esc(s.name)}</span>`).join('');
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img">${g}</svg></div><div class="legend">${leg}</div>`;
}
/* Lijn (linker as) met staven (rechter as). De rechter as wordt zo geschaald dat de staven waar mogelijk onder de lijn blijven. */
function comboChart({labels,line,bars,h=300}){
  const W=760,H=h,pl=70,pr=70,pt=14,pb=30, n=labels.length;
  const lv=line.values.filter(v=>v!=null), bv=bars.flatMap(b=>b.values).filter(v=>v!=null&&v>0);
  if(!lv.length) return '<p class="muted">Nog geen gegevens om te tonen.</p>';
  const ticks=niceTicks(Math.min(0,...lv),Math.max(...lv)), lo=ticks[0], hi=ticks[ticks.length-1];
  const y=v=>pt+(H-pt-pb)*(1-(v-lo)/(hi-lo||1));
  const maxB=Math.max(1,...bv);
  // schaal k: staafwaarde v wordt getekend op hoogte v*k (in eenheden van de linker as), zo hoog mogelijk maar net onder de lijn
  const ks=[]; line.values.forEach((L,i)=>{ const b=Math.max(0,...bars.map(s=>s.values[i]||0)); if(L!=null&&L>0&&b>0) ks.push(0.96*L/b); });
  ks.sort((a,b)=>a-b);
  let sc=ks.length? ks[0] : hi/maxB*0.6; // in elk jaar onder de lijn
  sc=Math.min(sc, 0.98*hi/maxB);
  const yb=v=>y(v*sc), rTicks=(()=>{ for(const nn of [4,3,2,1]){ const t=niceTicks(0,maxB,nn).filter(t=>t*sc<=hi*1.001); if(t.length<2||Math.abs(y(t[1]*sc)-y(0))>=16) return t; } return [0]; })();
  const band=(W-pl-pr)/n, x=i=>pl+band*(i+.5); let g='';
  for(const t of ticks){ g+=`<line x1="${pl}" x2="${W-pr}" y1="${y(t)}" y2="${y(t)}" stroke="${t===0?'#b8c7dc':'#e6edf6'}"/><text x="${pl-8}" y="${y(t)+4}" text-anchor="end" font-size="11" fill="#5a6b85">${esc(eurC.format(t))}</text>`;
  }
  for(const t of rTicks) g+=`<line x1="${W-pr}" x2="${W-pr+4}" y1="${yb(t)}" y2="${yb(t)}" stroke="#c9a07f"/><text x="${W-pr+8}" y="${yb(t)+4}" text-anchor="start" font-size="11" fill="#9a5a2e">${esc(eurC.format(t))}</text>`;
  const k=bars.length, gap=2, bw=Math.min(14,(band*.8-gap*(k-1))/k), tw=k*bw+(k-1)*gap;
  labels.forEach((l,i)=>{ bars.forEach((s,j)=>{ const v=s.values[i]||0; if(v<=0) return; const top=yb(v);
      g+=`<rect x="${x(i)-tw/2+j*(bw+gap)}" y="${top}" width="${bw}" height="${Math.max(0,y(0)-top)}" rx="1.5" fill="${s.color}" opacity=".85"><title>${esc(l)} · ${esc(s.name)}: ${esc(E(v))}</title></rect>`; }); });
  const every=Math.ceil(n/15);
  labels.forEach((l,i)=>{ if(i%every===0||every===1) g+=`<text x="${x(i)}" y="${H-10}" text-anchor="middle" font-size="11" fill="#5a6b85">${esc(l)}</text>`; });
  let d='',pen=false; line.values.forEach((v,i)=>{ if(v==null){pen=false;return;} d+=(pen?'L':'M')+x(i).toFixed(1)+' '+y(v).toFixed(1)+' '; pen=true; });
  g+=`<path d="${d}" fill="none" stroke="${line.color}" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>`;
  if(n<=60) line.values.forEach((v,i)=>{ if(v!=null) g+=`<circle cx="${x(i)}" cy="${y(v)}" r="3" fill="${line.color}"><title>${esc(line.name)} · ${esc(labels[i])}: ${esc(E(v))}</title></circle>`; });
  g+=`<text x="${pl}" y="${pt-2}" font-size="10.5" fill="#5a6b85">vermogen</text><text x="${W-pr}" y="${pt-2}" text-anchor="end" font-size="10.5" fill="#9a5a2e">per jaar</text>`;
  const leg=[`<span><i style="background:${line.color}"></i>${esc(line.name)} (linker as)</span>`,...bars.map(s=>`<span><i style="background:${s.color}"></i>${esc(s.name)} (rechter as)</span>`)].join('');
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H+4}" role="img" style="overflow:visible">${g}</svg></div><div class="legend">${leg}</div>`;
}
function barChart({labels,series,h=250,stacked=false}){
  const W=760,H=h,pl=70,pr=14,pt=14,pb=30; const n=labels.length;
  if(!n||!series.length) return '<p class="muted">Nog geen gegevens om te tonen.</p>';
  const totals=labels.map((_,i)=>stacked?sum(series.map(s=>s.values[i]||0)):Math.max(0,...series.map(s=>s.values[i]||0)));
  const ticks=niceTicks(0,Math.max(1,...totals)); const hi=ticks[ticks.length-1];
  const y=v=>pt+(H-pt-pb)*(1-v/hi); const band=(W-pl-pr)/n; let g='';
  for(const t of ticks) g+=`<line x1="${pl}" x2="${W-pr}" y1="${y(t)}" y2="${y(t)}" stroke="${t===0?'#b8c7dc':'#e6edf6'}"/><text x="${pl-8}" y="${y(t)+4}" text-anchor="end" font-size="11" fill="#5a6b85">${esc(eurC.format(t))}</text>`;
  const every=Math.ceil(n/15);
  labels.forEach((l,i)=>{
    const showLbl = i%every===0 || (i===n-1 && (n-1)%every >= every/2+0.5) || every===1;
    const x0=pl+i*band;
    if(stacked){ let acc=0; const bw=Math.min(34,band*.7);
      series.forEach(s=>{ const v=s.values[i]||0; if(v<=0) return; g+=`<rect x="${x0+(band-bw)/2}" y="${y(acc+v)}" width="${bw}" height="${Math.max(0,y(acc)-y(acc+v))}" fill="${s.color}" ${acc>0?'':'rx="2"'}><title>${esc(l)} · ${esc(s.name)}: ${esc(E(v))}</title></rect>`; acc+=v; });
    } else { const k=series.length, gap=2, bw=Math.min(18,(band*.75-gap*(k-1))/k), tw=k*bw+(k-1)*gap;
      series.forEach((s,j)=>{ const v=s.values[i]||0; g+=`<rect x="${x0+(band-tw)/2+j*(bw+gap)}" y="${y(v)}" width="${bw}" height="${Math.max(0,y(0)-y(v))}" rx="2" fill="${s.color}"><title>${esc(l)} · ${esc(s.name)}: ${esc(E(v))}</title></rect>`; });
    }
    if(showLbl) g+=`<text x="${x0+band/2}" y="${H-10}" text-anchor="middle" font-size="11" fill="#5a6b85">${esc(l)}</text>`;
  });
  const leg=series.map(s=>`<span><i style="background:${s.color}"></i>${esc(s.name)}</span>`).join('');
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img">${g}</svg></div><div class="legend">${leg}</div>`;
}

    else if(f.type==='textarea') inp=`<textarea id="${id}" rows="${f.rows||4}">${esc(val??'')}</textarea>`;
    else if(f.type==='num') inp=`<input id="${id}" inputmode="decimal" autocomplete="off" value="${esc(numIn(val))}" placeholder="${esc(f.ph||'')}">`;
    else if(f.type==='date') inp=`<input id="${id}" class="dnl" inputmode="numeric" autocomplete="off" value="${esc(isoToNl(val))}" placeholder="dd-mm-jjjj">`;

    else inp=`<input id="${id}" type="${f.type||'text'}" value="${esc(val??'')}" placeholder="${esc(f.ph||'')}">`;
    return `<div class="f" data-k="${f.k}"><label for="${id}">${esc(f.label)}${f.req?' *':''}</label>${inp}${f.help?`<div class="help">${f.help}</div>`:''}</div>`;
  };
  $('#modalRoot').innerHTML=`<div class="ov" id="ov"><form class="modal" id="mform" novalidate><h3>${esc(title)}</h3>${extra}${fields.map(fieldHtml).join('')}<div class="err" id="ferr"></div><div class="actions"><button type="button" class="btn sec" id="fcancel">Annuleren</button><button class="btn" type="submit">${esc(saveLabel)}</button></div></form></div>`;
  const read=()=>{ const o={}; for(const f of fields){ const el=$('#f_'+f.k); if(!el) continue; o[f.k]= f.type==='cb'?el.checked : f.type==='num'? parseNum(el.value) : f.type==='date'? (nlToIso(el.value) ?? '#ongeldig') : f.type==='month'? (nlToYm(el.value) ?? '#ongeldig') : el.value.trim(); } return o; };
  const refresh=()=>{ const cur=read(); for(const f of fields){ if(!f.show) continue; const box=document.querySelector(`.f[data-k="${f.k}"]`); if(box) box.style.display=f.show(cur)?'':'none'; } };
  $('#mform').addEventListener('input',refresh); $('#mform').addEventListener('change',refresh); refresh();
  $('#fcancel').onclick=closeModal; $('#ov').addEventListener('mousedown',e=>{ if(e.target.id==='ov') closeModal(); });
  $('#mform').onsubmit=e=>{ e.preventDefault(); const o=read();
    for(const f of fields){ if(f.show && !f.show(o)) { delete o[f.k]; continue; }
      if(o[f.k]==='#ongeldig'){ $('#ferr').textContent=`"${f.label}" is geen geldige ${f.type==='month'?'maand (mm-jjjj)':'datum (dd-mm-jjjj)'}.`; $('#f_'+f.k).focus(); return; }
      if(f.req && (o[f.k]===''||o[f.k]==null||(f.type==='num'&&isNaN(o[f.k])))){ $('#ferr').textContent=`Vul "${f.label}" in.`; return; }
      if(f.type==='num' && o[f.k]!=='' && o[f.k]!=null && isNaN(o[f.k]) ) o[f.k]=null; }
    const msg=onSave(o); if(typeof msg==='string'){ $('#ferr').textContent=msg; return; }
    closeModal(); save(); render(); };
  setTimeout(()=>{ const first=$('#mform input:not([type=checkbox]),#mform select'); first&&first.focus(); },30);

function addYearsIso(d,n){ const y=+d.slice(0,4)+n, m=d.slice(5,7); const last=+lastDay(y+'-'+m).slice(8); return y+'-'+m+'-'+pad(Math.min(+d.slice(8),last)); }
function applySeries(rec){
  if(rec.series) S.actuals=S.actuals.filter(x=>!(x.series===rec.series && x!==rec && x.date>rec.date));
  if(!rec.rep){ delete rec.series; return 0; }
  rec.series ||= uid(); let n=0;
  for(let k=1;;k++){ const d=addYearsIso(rec.date,k*rec.repYears); if(+d.slice(0,4)>rec.repUntil) break;
    const f=Math.pow(1+(+rec.repInfl||0)/100,k*rec.repYears);
    S.actuals.push({id:uid(),kind:'uit',cat:rec.cat,sub:rec.sub||'',date:d,amount:Math.round(rec.amount*f),note:rec.note,months:rec.months,series:rec.series,rep:true,repYears:rec.repYears,repUntil:rec.repUntil,repInfl:rec.repInfl}); n++; }
  return n;
}

/* ===== Verwacht rendement per rekening, per maand (vanaf volgende maand) =====

}
/* Grote en incidentele uitgaven in een toekomstige maand (k=1: ook de rest van deze maand) */

  return [...S.actuals.filter(a=>a.kind==='uit'&&!a.grid&&a.monthTotal==null&&inM(a.date)).map(a=>({txt:a.note||a.cat,amt:+a.amount,inv:isInv(a),ym:a.date.slice(0,7)})),
          ...S.expected.filter(e=>e.kind==='uit'&&(e.ym===ym||(k===1&&e.ym===curYm()))).map(e=>({txt:e.note||e.cat,amt:+e.amount,inv:false,ym:e.ym}))];

/* Correcties op het rendement:

    for(const r of S.recurring) if(r.kind==='in' && isOnceRec(r) && r.start===ym) inc-=+r.amount;
    for(const e of S.expected) if(e.kind==='in' && e.ym===ym) inc-=+e.amount; }

}
function avgRate(list,ym){ const w=sum(list.map(a=>(currentOf(a.id)||{}).value||0)); return w?sum(list.map(a=>((currentOf(a.id)||{}).value||0)*rateAt(a,ym+'-01')))/w:0; }

const reinvRate = a => { if(a.reinvest!=null && a.reinvest!=='' && !isNaN(a.reinvest)) return +a.reinvest; if(S.settings.reinvestRate!=null) return +S.settings.reinvestRate; return rateAt(a,endDateOf(a)||todayStr()); };

function kortPlan(off=kortOff,count=12){

  const hi=histAvg('in'), hu=histAvg('uit');

    for(const a of S.actuals) if(a.kind==='uit' && !a.grid && a.monthTotal==null && inFirst(a.date)) (isInv(a)?inv:expI).push({txt:a.note||a.cat,amt:+a.amount});
    for(const a of S.actuals) if(a.kind==='in' && !a.grid && inFirst(a.date)) incI.push({txt:a.note||a.cat,amt:+a.amount});

function hgAction(a,b){
  const kind=hgKind, list=hgList(kind), M=hgMap();
  if(a==='hgSel'){ hgSel=b.dataset.id; }
  else if(a==='hgKind'){ hgKind=b.dataset.v; hgSel=null; }
  else if(a==='hgAdd'){ const n=($('#hgNew').value||'').trim(); if(!n){ toast('Vul een naam in'); return; } if(list.some(g=>g.name.toLowerCase()===n.toLowerCase())){ toast('Die hoofdgroep bestaat al'); return; } const g={id:uid(),name:n}; list.push(g); hgSel=g.id; save(); }
  else if(a==='hgDel'){ const g=list.find(x=>x.id===b.dataset.id); if(!g) return; if(!confirm(`Hoofdgroep "${g.name}" verwijderen? De categorieën erin worden weer "niet ingedeeld".`)) return;
    S.settings.hgroups[kind]=list.filter(x=>x!==g); for(const k of Object.keys(M)) if(M[k]===g.id) delete M[k]; save(); }
  else if(a==='hgUn'){ delete M[b.dataset.k]; save(); }
  else if(a==='hgAuto'){ const cats=kind==='uit'?S.expCats:S.incCats; let n=0;
    for(const c of cats){ if(M[kind+'|'+c]) continue; const nm=autoGroup(kind,c); let g=list.find(x=>x.name===nm); if(!g){ g={id:uid(),name:nm}; list.push(g); } M[kind+'|'+c]=g.id; n++; }
    save(); toast(n?n+' categorieën ingedeeld (voorstel)':'Alles was al ingedeeld'); }
  else if(a==='hgClear'){ if(!confirm('Alle indelingen voor '+(kind==='uit'?'uitgaven':'inkomsten')+' leegmaken? De hoofdgroepen zelf blijven bestaan.')) return; for(const k of Object.keys(M)) if(k.startsWith(kind+'|')) delete M[k]; save(); }
  const sc=window.scrollY; render(); window.scrollTo(0,sc);
}

function loadImg(file){ return new Promise((res,rej)=>{ const u=URL.createObjectURL(file), im=new Image(); im.onload=()=>{ res(im); setTimeout(()=>URL.revokeObjectURL(u),1000); }; im.onerror=()=>{ URL.revokeObjectURL(u); rej(new Error('img')); }; im.src=u; }); }
function canvasOf(im,max){ const sc=Math.min(1,max/Math.max(im.naturalWidth,im.naturalHeight)); const c=document.createElement('canvas'); c.width=Math.max(1,Math.round(im.naturalWidth*sc)); c.height=Math.max(1,Math.round(im.naturalHeight*sc)); const x=c.getContext('2d'); x.fillStyle='#fff'; x.fillRect(0,0,c.width,c.height); x.drawImage(im,0,0,c.width,c.height); return c; }

async function attPrepare(file){

/* Box 3 (forfaitair stelsel tot 2028, met tegenbewijsregeling). sp = bank- en spaartegoeden, ov = overige bezittingen, hv = heffingsvrij vermogen per persoon, t = tarief */
const BOX3={2024:{sp:1.03,ov:6.04,hv:57000,t:36},2025:{sp:1.44,ov:5.88,hv:57684,t:36},2026:{sp:1.28,ov:6.00,hv:59357,t:36,voorl:true}};
const b3Par=y=>{ if(BOX3[y]) return {...BOX3[y],est:false}; const ks=Object.keys(BOX3).map(Number).sort(); const k=y<ks[0]?ks[0]:ks[ks.length-1]; return {...BOX3[k],est:true,from:k}; };
const b3Cat=a=>({betaal:'sp',spaar:'sp',deposito:'sp',contant:'sp'}[a.type]||'ov');
function box3Calc(y){
  const P=b3Par(y), cy=curY(), partner=S.settings.box3Partner??(S.settings.people.length>=2), n=partner?2:1;
  const v={sp:0,ov:0}, items=[], missing=[]; let est=false;
  for(const a of S.accounts){ if(a.noBox3) continue; let m=valueAt(a.id,y+'-01-01'), val;
    if(y>cy){ const c=currentOf(a.id); val=c?c.value:0; est=true; }
    else if(m) val=m.value; else { if(a.start && a.start>=y+'-01-01') continue; const f=measOf(a.id)[0]; if(f && f.date.slice(0,4)<=String(y)){ val=f.value; missing.push(a.name); } else continue; }
    if(!val) continue; const c=b3Cat(a); v[c]+=val; items.push({a,c,val}); }
  const rg=v.sp+v.ov, rend=v.sp*P.sp/100+v.ov*P.ov/100, eff=rg?rend/rg:0, hv=P.hv*n, gr=Math.max(0,rg-hv), vrd=gr*eff, tax=vrd*P.t/100;
  // werkelijk rendement (tegenbewijs): over het hele box 3-vermogen, zonder heffingsvrij vermogen
  let real=null, realPartial=false;
  if(y<=cy){ let e=0, any=false; for(const a of S.accounts){ if(a.noBox3) continue; const r=yearRend(a,y); if(r&&r.eur!=null){ e+=r.eur; any=true; if(r.partial||r.expected) realPartial=true; } } if(any) real=e; if(y===cy) realPartial=true; }
  const realTax=real==null?null:Math.max(0,real)*P.t/100;
  const pay=realTax!=null&&!realPartial&&realTax<tax?realTax:tax;
  return {y,P,n,v,rg,rend,eff,hv,gr,vrd,tax,real,realTax,realPartial,pay,items,missing,est};
}

function renameCat(kind,old,nw){
  nw=nw.trim(); const list=kind==='uit'?S.expCats:S.incCats;
  if(!nw) return 'Een categorie heeft een naam nodig';
  if(nw===old) return null;
  if(nw===AFS) return '"Afschrijving" is gereserveerd';
  if(list.includes(nw)) return 'Die categorie bestaat al';
  list[list.indexOf(old)]=nw;
  { const M=S.settings.hmap||{}; for(const k of Object.keys(M)){ if(k===kind+'|'+old||k.startsWith(kind+'|'+old+'|')){ M[kind+'|'+nw+k.slice((kind+'|'+old).length)]=M[k]; delete M[k]; } } }
  for(const a of S.actuals) if(a.kind===kind&&a.cat===old) a.cat=nw;
  for(const r of S.recurring) if(r.kind===kind&&r.cat===old) r.cat=nw;
  for(const e of S.expected) if(e.kind===kind&&e.cat===old) e.cat=nw;
  if(kind==='uit'){ if(S.subCats[old]){ S.subCats[nw]=S.subCats[old]; delete S.subCats[old]; }
    S.settings.noInvCats=S.settings.noInvCats.map(c=>c===old?nw:c); }
  else for(const p of S.incPlan) if(p.cat===old) p.cat=nw;
  return null;
}
function renameSub(cat,old,nw){
  nw=nw.trim(); const subs=S.subCats[cat]||[];
  if(!nw) return 'Een subcategorie heeft een naam nodig';
  if(nw===old) return null; if(subs.includes(nw)) return 'Die subcategorie bestaat al';
  subs[subs.indexOf(old)]=nw;
  for(const a of S.actuals) if(a.kind==='uit'&&a.cat===cat&&a.sub===old){ a.sub=nw; if(a.note===old) a.note=nw; }
  return null;
}

  <p><b>Jouw persoonlijke inflatie</b> (onderaan): de app haalt elke twee weken de prijsstijging per categorie op bij het CBS (jaarmutatie van de consumentenprijsindex). Per categorie: jouw aandeel in de uitgaven van de laatste 12 maanden × de prijsstijging = bijdrage. Alle bijdragen samen zijn jouw inflatie. <i>Voorbeeld:</i> boodschappen zijn 18% van je uitgaven en worden 3,4% duurder: 0,18 × 3,4 = 0,61 procentpunt.</p>
  <ul><li><b>Categorieën koppelen:</b> de app stelt per categorie een CBS-categorie voor; je kunt dat aanpassen of een eigen percentage invullen.</li><li><b>Hypotheek:</b> telt niet mee (het CBS ziet een koopwoning als investering) en blijft in de 30-jaarsplanning gelijk.</li><li><b>Investeringen:</b> een auto telt mee met de afschrijving per maand (aanschaf van voertuigen); andere investeringen standaard niet.</li><li><b>Maandcijfer:</b> het CBS meet de inflatie per maand: de prijzen van die maand vergeleken met dezelfde maand een jaar eerder (oktober tegenover oktober). De app gebruikt het gemiddelde van de laatste 12 maandcijfers, net als het CBS voor een heel jaar.</li><li><b>Lange termijn (30 jaar):</b> de inflatie-aanname uit Instellingen plus jouw vaste afwijking van het landelijk gemiddelde (over 10 jaar, maximaal 1,5 procentpunt). Het eerste jaar ligt tussen je huidige inflatie en die waarde in.</li></ul>`],
 vast:['Vaste posten',`<p>Je vaste lasten zitten al in je werkelijke uitgaven, en daarmee in de planning (gemiddelde van de laatste 24 maanden). Je hoeft ze hier niet allemaal in te vullen.</p>
  <p>Gebruik deze pagina voor vaste lasten die <b>in de toekomst stoppen, beginnen of veranderen</b>: een lening of lease met einddatum, een premie die op een leeftijd stopt, reiskosten die stoppen bij pensioen, een nieuwe verzekering.</p>
  <p><b>Berekening:</b> de app kijkt alleen naar het <b>verschil met nu</b>. <i>Voorbeeld:</i> uitgaven €3.000 per maand inclusief €1.000 hypotheek die eind 2030 stopt → tot 2030 €3.000, vanaf 2031 €2.000 per maand (plus inflatie). Een vaste last die gewoon doorloopt verandert niets, dus er telt niets dubbel.</p>
  <p>Inkomsten beheer je op Inkomen plannen; het is dezelfde lijst.</p>`],
 investeringen:['Investeringen',`<p>Grote aankopen boven het grensbedrag. De <b>betaling</b> zie je terug in je saldi; de <b>afschrijving</b> verdeelt de kosten over de maanden.</p>
  <p><i>Voorbeeld:</i> een vloer van €15.000 over 15 jaar = €83 per maand afschrijving in het maandoverzicht en bij Analyse.</p>
  <p><b>Toekomstige aankoop:</b> vul de datum en het verwachte bedrag in. In de 30-jaarsplanning, Komende maanden en Vrij geld telt die volledig mee in de maand van betaling (zonder afschrijving).</p>
  <p><b>Herhalen:</b> bijvoorbeeld elke 8 jaar een auto, met een prijsstijging per jaar. Pas je een herhaling aan, dan worden de latere opnieuw berekend.</p>
  <p><b>Bijlagen (📎):</b> voeg foto's of pdf's toe van offertes, facturen, garantiebewijzen en bonnen. Ze worden versleuteld opgeslagen in je privé-repository (map bijlagen), net als je andere gegevens. Foto's worden automatisch verkleind; maximaal 15 MB per bestand.</p>`],
 rendement:['Rendement',`<p><b>Verwacht rendement komende jaren</b>, per rekening:</p>
  <ul><li><span class="badge g">zeker</span> <b>Deposito's:</b> vaste rente op de uitkeringsdatum of de einddatum; de rente gaat naar je betaalrekening (geen rente op rente). <i>Voorbeeld:</i> €6.000 × 2,5% over 2 jaar = €300, alleen in het jaar van de einddatum.</li>
  <li><span class="badge">verwacht</span> <b>Spaarrekeningen:</b> het ingestelde (variabele) rentepercentage, met rente op rente.</li>
  <li><span class="badge">verwacht</span> <b>Goud, aandelen, crypto:</b> het verwachte rendement dat je per rekening instelt (Bewerken).</li></ul>
  <p><b>Percentage per rekening:</b> rendement in een jaar ÷ <b>gemiddeld saldo</b> in dat jaar (gem.).</p><p><b>Rekenstappen onderaan:</b> de bedragen per rekening gaan uit van het saldo zonder aankopen en zonder spaaroverschot. Twee rekenstappen maken dat kloppend:</p><ul><li><b>Geen rente over uitgegeven geld:</b> geld dat je uitgeeft is weg en levert geen rente meer op. Die rente wordt eraf gehaald (uitgegeven bedrag × gemiddelde spaarrente, vanaf de maand na de aankoop). Dit is geen verlies of kosten, alleen het weghalen van rente die je nooit krijgt.</li><li><b>Rente over gespaard overschot:</b> wat je per maand overhoudt gaat naar je spaarrekening en levert daar rente op.</li></ul><p><b>Verwacht rendement op je vermogen</b> = rente en rendement over het geld dat je echt hebt, gedeeld door je <b>gemiddelde vermogen</b> in dat jaar. Dat zegt hoe goed je vermogen het doet, los van wat je uitgeeft: geef je €35.000 uit, dan dalen de rente én het gemiddelde vermogen, en blijft het percentage ongeveer gelijk.</p>
  <p><b>Herbeleggen:</b> na de einddatum van een deposito rekent de app alsof je het geld opnieuw vastzet, met elk jaar rente naar je betaalrekening (<span class="badge">verwacht</span>). Het percentage stel je in bij Instellingen (leeg = dezelfde rente, 0 = niet herbeleggen) of per deposito bij Bewerken.</p>
  <p><b>Reëel rendement:</b> verwacht rendement min de inflatie. <i>Voorbeeld:</i> 3,2% rendement bij 2% inflatie = 1,2% reëel: je vermogen wordt echt meer waard.</p>
  <p><b>Scenario's:</b> wat er gebeurt als goud, aandelen en crypto tegenvallen (voorzichtig, standaard 0%) of meevallen (gunstig, standaard 3 procentpunt boven je verwachting). Rente op sparen en deposito's blijft gelijk.</p>
  <p><b>Verdeling van je vermogen:</b> huidige waarde per soort, met het verwachte rendement over de komende 12 maanden.</p>
  <p><b>Verwacht tegenover werkelijk:</b> de app onthoudt de verwachting voor elk komend jaar (de laatste stand vóór 1 januari). Na afloop van het jaar zie je die naast het werkelijke rendement.</p>
  <p><b>Vermogensbelasting (box 3):</b> de app telt je saldi op 1 januari op (spaargeld en overige bezittingen), trekt het heffingsvrij vermogen af en rekent met de fictieve percentages van de Belastingdienst; daarover betaal je 36%. Daarnaast rekent hij met je werkelijke rendement over je hele box 3-vermogen (zonder vrijstelling). Je betaalt het laagste bedrag. <i>Voorbeeld 2026:</i> € 150.000 spaargeld, fiscale partners: (€ 150.000 − € 118.714) × 1,28% × 36% ≈ € 144. Met de vinkjes in de kaart bepaal je per rekening of hij meetelt (vinkje aan = telt mee).</p>
  <p><b>Rendement tot nu:</b> bij rekeningen met rente telt eerst de rente die je echt hebt ontvangen; anders een schatting op basis van saldi en rente. Bij goud en beleggingen: waardestijging min bijgestorte bedragen.</p>`],
 prognose:['30 jaar',`<p>Een berekening van je vermogen over 30 jaar. Geen garantie en geen beleggingsadvies.</p>
  <p><b>Per jaar:</b> vermogen begin + rendement + inkomsten − uitgaven = vermogen eind.</p>
  <ul><li><b>Start:</b> je vermogen van vandaag, plus de verwachte inkomsten en uitgaven in de rest van dit jaar.</li>
  <li><b>Inkomsten:</b> volgens Inkomen plannen, met de inkomensgroei erbij; salaris stopt op de stopdatum uit Instellingen.</li>
  <li><b>Uitgaven:</b> gemiddelde van de werkelijke uitgaven over de laatste 24 maanden, met inflatie, plus wijzigingen in vaste lasten (Vaste posten), plus toekomstige aankopen in het jaar van betaling.</li>
  <li><b>Rendement:</b> het percentage uit Instellingen (of per jaar in de tabel) over het vermogen aan het begin van het jaar.</li>
  <li><b>Persoonlijke inflatie:</b> staat het vinkje bij Analyse aan, dan stijgen je uitgaven met de inflatie-aanname uit Instellingen plus jouw persoonlijke afwijking (zie Analyse), en blijven je hypotheek en andere vaste bedragen gelijk. Het grijze percentage in de tabel is jouw verwachte inflatie voor dat jaar; een ingevuld percentage geldt voor alles in dat jaar.</li>
  <li><b>Euro's van nu:</b> corrigeert alles voor inflatie. Inkomen dat minder groeit dan de inflatie daalt dan; uitgaven blijven gelijk.</li></ul>
  <p><i>Voorbeeld:</i> €300.000 begin + 4% rendement (€12.000) + €60.000 inkomsten − €70.000 uitgaven (incl. een auto) = €302.000: het vermogen stijgt toch, omdat het rendement het tekort goedmaakt.</p>`],
 instellingen:['Instellingen',`<p>Categorieën, standaardaannames (inflatie, rendement, inkomensgroei, grensbedrag investeringen), personen met geboortedatum en stopdatum, en je gegevens (back-up).</p>
  <p><b>Back-up kopiëren/downloaden</b> maakt een kopie van al je gegevens; met <b>Back-up plakken/terugzetten</b> zet je die terug.</p>`]
};

}
function addHelpBtn(){ const h1=document.querySelector('#main h1'); if(h1 && HELP[view] && !h1.querySelector('.helpbtn')) h1.insertAdjacentHTML('beforeend',' <button class="helpbtn" data-a="help" title="Uitleg bij deze pagina" aria-label="Uitleg">?</button>'); }
function render(){
  _cpiMemo=null; _cpiRowsMemo=null;

  addHelpBtn(); addCardHelp();
  if(view==='kort') kortAfter(true);
  { const w=document.querySelector('.amwrap'); if(w){ w.scrollLeft=window._amSL??w.scrollWidth; w.addEventListener('scroll',()=>{ window._amSL=w.scrollLeft; }); } }
}

/* ============ Acties ============ */
function keepScroll(focusSel){ const sc=window.scrollY; render(); window.scrollTo(0,sc); if(focusSel){ const el=document.querySelector(focusSel); el&&el.focus(); } }
function addSub(c,val){ const nm=(val||'').trim(); if(!nm) return; const subs=(S.subCats[c] ||= []);
  if(subs.includes(nm)){ toast('Die subcategorie bestaat al'); return; } subs.push(nm); save(); keepScroll(`.subnew[data-cat="${CSS.escape(c)}"]`); }

      for(const g of goldAccs()){ const gr=+g.gram||0; if(!gr){ miss++; continue; }
        S.meas=S.meas.filter(m=>!(m.acc===g.id && m.date===d && m.gold));
        S.meas.push({id:uid(),acc:g.id,date:d,value:Math.round(gr*price*goldPctOf(g))/100,at:Date.now(),gold:true}); n++; }
      save(); keepScroll();
      toast(n?`Goudwaarde bijgewerkt voor ${n} rekening${n===1?'':'en'}${miss?`; ${miss} zonder gewicht overgeslagen`:''}`:'Vul eerst bij de goudrekening het gewicht in (Wijzig)'); break; }
    case 'meas': measForm(acc,null,b.dataset.date); break;

    case 'gCopy': { const ym=invYm(), prev=iYm(ymI(ym)-1), kind=invKind; let n=0;
      const prevRecs=S.actuals.filter(a=>a.grid&&a.monthTotal==null&&a.kind===kind&&a.date.slice(0,7)===prev);
      if(kind==='uit'){ const pt=monthTotalRec(prev); if(pt&&!monthTotalRec(ym)){ setMonthTotal(ym,pt.monthTotal); n++; } }

        for(const r of prevRecs.filter(a=>a.cat===cat)){ setGrid(ym,cat,r.sub,r.amount,kind); n++; } }
      save(); render(); toast(n?`${n} bedrag${n===1?'':'en'} overgenomen; ingevulde categorieën bleven ongewijzigd`:'Niets overgenomen: vorige maand is leeg of alles is al ingevuld'); break; }
    case 'mYm': selYm=b.dataset.ym; render(); break;

    case 'invView': invView=b.dataset.v; render(); break;

    case 'gOpenMonth': e.preventDefault(); gridYm=b.dataset.ym; invView='maand'; invMode=null; render(); window.scrollTo(0,0); break;
    case 'vrijDetail': vrijDetail=!vrijDetail; keepScroll(); break;
    case 'vrijH': vrijH=+b.dataset.v; keepScroll(); break;
    case 'anKind': anKind=b.dataset.v; anFocus=null; anPieCat=null; render(); break;

    case 'pieCat': anPieCat=(b.dataset.cat&&anPieCat!==b.dataset.cat)?b.dataset.cat:null; keepScroll(); break;

    case 'addAct': actualForm(k,null,view==='maand'?selYm:view==='invoer'?invYm():null); break;
    case 'editAct': { const x=S.actuals.find(z=>z.id===id); actualForm(x.kind,x); break; }

    case 'att': attModal(id); break;
    case 'amShow': case 'amShowAll': { S.settings.amOff=a==='amShowAll'?[]:(S.settings.amOff||[]).filter(x=>x!==id); save(); keepScroll(); break; }
    case 'addExp': expectedForm(null,selYm); break;

    case 'addRec': recurringForm(k); break;

    case 'chelp': e.preventDefault(); e.stopPropagation(); cardHelpModal(b.dataset.k); break;
    case 'hgSel': case 'hgKind': case 'hgAdd': case 'hgDel': case 'hgUn': case 'hgAuto': case 'hgClear': if(a==='hgSel' && e.target.closest('input')){ hgSel=b.dataset.id; document.querySelectorAll('#hgCard [data-a=hgSel]').forEach(x=>x.style.border=x===b?'2px solid var(--b500,#2a78d6)':''); break; } hgAction(a,b); break;

    case 'real': S.settings.real=b.dataset.v==='1'; save(); render(); break;
    case 'saveSet': {
      const g=i=>parseNum($('#s_'+i).value); const vals={threshold:g('threshold'),infl:g('infl'),rend:g('rend'),growth:g('growth'),box3:g('box3')};
      if(Object.values(vals).some(v=>isNaN(v))) { toast('Controleer de getallen'); return; }
      const rv=$('#s_reinv').value.trim(); S.settings.reinvestRate=rv===''?null:parseNum(rv); if(rv!==''&&isNaN(S.settings.reinvestRate)){ toast('Controleer het herbeleggingspercentage'); return; }
      const sl=parseNum($('#s_scenLow').value), sh=parseNum($('#s_scenHigh').value); if(!isNaN(sl)) S.settings.scenLow=sl; if(!isNaN(sh)) S.settings.scenHigh=sh;
      S.settings.box3Partner=$('#s_b3partner').checked;
      { const sf=parseInt($('#s_showFrom').value,10); if(!isNaN(sf)&&sf>1990&&sf<=curY()) S.settings.showFrom=sf; else { toast('Vul bij "Toon jaren vanaf" een jaartal in'); return; } }
      Object.assign(S.settings,vals); S.settings.people=$('#s_people').value.split(',').map(x=>x.trim()).filter(Boolean); save(); render(); toast('Instellingen opgeslagen'); break; }
    case 'catAdd': { const k=b.dataset.kind, el=$('#newCat_'+k), nm=el.value.trim(), list=k==='uit'?S.expCats:S.incCats;
      if(!nm) { el.focus(); return; } if(nm===AFS||list.includes(nm)){ toast('Die categorie bestaat al'); return; }

    case 'subAdd': { const c=b.dataset.cat, el=document.querySelector(`.subnew[data-cat="${CSS.escape(c)}"]`); addSub(c,el.value); break; }
    case 'subDel': { const c=b.dataset.cat, sb=b.dataset.sub, n=catUsage('uit',c,sb);
      confirmBox(`De subcategorie <b>${esc(sb)}</b> wordt verwijderd uit ${esc(c)}.${n?` Er ${n===1?'is':'zijn'} ${n} bedrag${n===1?'':'en'} mee ingevoerd; die blijven bewaard.`:''}`,()=>{ S.subCats[c]=(S.subCats[c]||[]).filter(x=>x!==sb); if(!S.subCats[c].length) delete S.subCats[c]; }); break; }
    case 'saveCats': {
      const L=i=>[...new Set($('#s_'+i).value.split('\n').map(x=>x.trim()).filter(x=>x&&x!==AFS))];
      const inc=L('inc'), exp=[], subs={};
      for(const line of L('exp')){ const [c,rest]=line.split(/:(.*)/s); const cat=c.trim(); if(!cat||cat===AFS||exp.includes(cat)) continue; exp.push(cat);
        const sl=(rest||'').split(',').map(x=>x.trim()).filter(Boolean); if(sl.length) subs[cat]=[...new Set(sl)]; }
      if(!inc.length||!exp.length){ toast('Houd minstens één categorie over'); return; }
      S.incCats=inc; S.expCats=exp; S.subCats=subs; S.settings.noInvCats=[...document.querySelectorAll('.noinv:checked')].map(x=>x.value).filter(c=>exp.includes(c)); save(); render(); toast('Categorieën opgeslagen'); break; }
    case 'export': {
      try{ const blob=new Blob([JSON.stringify(S,null,1)],{type:'application/json'}); const u=URL.createObjectURL(blob); const l=document.createElement('a'); l.href=u; l.download='huishoudfinancien-backup-'+todayStr()+'.json'; document.body.appendChild(l); l.click(); l.remove(); setTimeout(()=>URL.revokeObjectURL(u),2000); toast('Back-up gedownload'); }catch(err){ toast('Downloaden lukt niet; gebruik Back-up kopiëren'); } break; }
    case 'paste': pasteModal(); break;
    case 'unlink': unlinkDevice(); break;
    case 'copy': { const txt=JSON.stringify(S); const show=()=>{ $('#modalRoot').innerHTML=`<div class="ov"><div class="modal"><h3>Back-up kopiëren</h3><p class="small">Kopiëren naar het klembord lukte niet automatisch. Selecteer de tekst hieronder en kopieer hem zelf.</p><div class="f"><textarea id="cpTxt" rows="8" readonly></textarea></div><div class="actions"><button class="btn" id="cpOk">Sluiten</button></div></div></div>`; $('#cpTxt').value=txt; $('#cpOk').onclick=closeModal; setTimeout(()=>{ $('#cpTxt').focus(); $('#cpTxt').select(); },30); };
      try{ navigator.clipboard.writeText(txt).then(()=>toast('Back-up gekopieerd naar het klembord'),show); }catch(e){ show(); } break; }
    case 'demo': confirmBox('Je huidige gegevens worden vervangen door voorbeeldgegevens. Maak eerst een back-up als je ze wilt bewaren.',()=>{ S=demoState(); normalize(); delete S._migrated; },'Vervangen'); break;
    case 'wipe': confirmBox('Alle gegevens worden gewist, op al je apparaten. Categorieën en instellingen blijven behouden.',()=>{ const keep={settings:S.settings,incCats:S.incCats,expCats:S.expCats,subCats:S.subCats}; S=Object.assign(emptyState(),keep); S.settings.real=false; },'Wissen'); break;
  }
});
document.addEventListener('input',e=>{ const t=e.target; if(t.classList&&(t.classList.contains('dnl')||t.classList.contains('mnl'))) autoMask(t); });
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.classList.contains('catname') && t.dataset.cat){ const err=renameCat(t.dataset.kind,t.dataset.cat,t.value); if(err){ toast(err); t.value=t.dataset.cat; return; } save(); keepScroll(); toast('Naam gewijzigd'); return; }
  if(t.classList.contains('subname')){ const err=renameSub(t.dataset.cat,t.dataset.sub,t.value); if(err){ toast(err); t.value=t.dataset.sub; return; } save(); keepScroll(); toast('Naam gewijzigd'); return; }
  if(t.classList.contains('pfield')){ const v=nlToIso(t.value); if(v===null){ toast('Vul de datum in als dd-mm-jjjj, bijvoorbeeld 10-09-1963'); t.focus(); return; }
    const P=(S.settings.persons ||= {}); const o=(P[t.dataset.p] ||= {}); if(v) o[t.dataset.k]=v; else delete o[t.dataset.k]; save(); keepScroll(); toast(v?'Opgeslagen: '+dNl(v):'Datum gewist'); return; }
  if(t.classList.contains('hgpick')){ if(!hgSel){ toast('Kies eerst links een hoofdgroep'); t.checked=false; return; } hgMap()[t.dataset.k]=hgSel; save(); const sc=window.scrollY; render(); window.scrollTo(0,sc); return; }
  if(t.classList.contains('hgname')){ const g=hgList(hgKind).find(x=>x.id===t.dataset.id); const n=t.value.trim(); if(g&&n){ g.name=n; save(); toast('Naam gewijzigd'); } else if(g) t.value=g.name; return; }
  if(t.classList.contains('amacc')){ const o=new Set(S.settings.amOff||[]); if(t.checked) o.delete(t.dataset.id); else o.add(t.dataset.id); S.settings.amOff=[...o]; save(); const w=document.querySelector('.amtab')?.parentElement, st=w?[w.scrollTop,w.scrollLeft]:null; keepScroll(); const w2=document.querySelector('.amtab')?.parentElement; if(w2&&st){ w2.scrollTop=st[0]; w2.scrollLeft=st[1]; } return; }
  if(t.classList.contains('b3acc')){ const a=accById(t.dataset.id); if(a){ if(t.checked) delete a.noBox3; else a.noBox3=true; save(); keepScroll(); toast(a.name+(t.checked?': telt mee voor box 3':': telt niet mee voor box 3')); } return; }
  if(t.id==='cpiUse'){ S.settings.cpiUse=t.checked; _cpiMemo=null; save(); keepScroll(); toast(t.checked?'Persoonlijke inflatie wordt gebruikt':'Vaste inflatie uit Instellingen wordt gebruikt'); return; }
  if(t.id==='aowLater'){ S.settings.aowLater=+t.value; save(); keepScroll(); toast('Opgeslagen'); return; }
  if(t.classList.contains('workcat')){ S.settings.workCats=[...document.querySelectorAll('.workcat:checked')].map(x=>x.value); save(); toast('Opgeslagen'); return; }
  if(t.classList.contains('noinv1')){ const c=t.dataset.cat; S.settings.noInvCats=S.settings.noInvCats.filter(x=>x!==c); if(t.checked) S.settings.noInvCats.push(c); save(); toast(t.checked?c+': nooit een investering':c+': uitgaven boven het grensbedrag worden weer investeringen'); return; }
  if(e.target.classList.contains('gcell')){
    const ym=e.target.dataset.ym||invYm(), cat=e.target.dataset.cat, sub=e.target.dataset.sub, kind=e.target.dataset.kind||'uit', mode=e.target.dataset.mode||'act', v=parseNum(e.target.value);
    if(e.target.value.trim()!=='' && isNaN(v)){ toast('Geen geldig bedrag'); return; }
    if(v<0){ toast('Vul een positief bedrag in'); return; }
    if(cat==='__TOTAL__'){ setMonthTotal(ym,v); toast(isNaN(v)?'Maandtotaal gewist':'Maandtotaal opgeslagen'); }
    else if(mode==='exp'){ setPlan(cat,sub,ym,v,invFwd); toast(isNaN(v)?'Verwachting gewist':invFwd?'Verwachting opgeslagen vanaf '+mLong(ym):'Verwachting opgeslagen voor '+mLong(ym)); }
    else {
      if(sub && !isNaN(v) && gridRec(ym,cat,'',kind)){ setGrid(ym,cat,'',NaN,kind); toast('Het totaal van '+cat+' wordt nu uit de onderverdeling berekend'); }
      setGrid(ym,cat,sub,v,kind);
    }
    save();
    requestAnimationFrame(()=>{ const ae=document.activeElement, key=ae&&ae.classList.contains('gcell')?[ae.dataset.cat,ae.dataset.sub,ae.dataset.ym]:null, sc=window.scrollY, yw=document.querySelector('.ywrap'), sx=yw?yw.scrollLeft:0;
      render(); window.scrollTo(0,sc); const yw2=document.querySelector('.ywrap'); if(yw2) yw2.scrollLeft=sx;
      if(key){ const el=[...document.querySelectorAll('.gcell')].find(x=>x.dataset.cat===key[0]&&x.dataset.sub===key[1]&&x.dataset.ym===key[2]); if(el&&!el.disabled&&!el.dataset.calc){ el.focus({preventScroll:true}); el.select(); } } });
    return;
  }
  if(e.target.id==='ymPick' && e.target.value){ selYm=e.target.value; render(); }
  if(e.target.id==='invPick' && e.target.value){ gridYm=e.target.value; invMode=null; render(); }
  if(e.target.id==='invFwd'){ invFwd=e.target.checked; }
  if(e.target.classList.contains('mpYear')){ const k=e.target.value+'-'+e.target.dataset.m; if(e.target.dataset.act==='gYm'){ gridYm=k; invMode=null; } else selYm=k; render(); }
  if(e.target.id==='anPer'){ anPer=e.target.value; render(); }
  if(e.target.id==='anFrom'||e.target.id==='anTo'){ const v=nlToYm(e.target.value); if(!v){ toast('Vul een maand in als mm-jjjj'); return; } if(e.target.id==='anFrom') anFrom=v; else anTo=v; render(); }
  if(e.target.id==='anYm'){ const v=nlToYm(e.target.value); if(!v){ toast('Vul een maand in als mm-jjjj'); return; } anYm=v; render(); }
  if(e.target.id==='vrijFlows'){ vrijFlows=e.target.checked; keepScroll(); }
  if(e.target.id==='anSubs'){ anSubs=e.target.checked; keepScroll(); }
  if(e.target.classList.contains('cmpYear')){ anCmp=[...document.querySelectorAll('.cmpYear:checked')].map(x=>x.value).sort(); keepScroll(); }
  if(e.target.classList.contains('cell')){
    const y=e.target.dataset.year, k=e.target.dataset.key, v=parseNum(e.target.value);
    const o=S.years[y]||(S.years[y]={}); if(isNaN(v)) delete o[k]; else o[k]=v; if(!Object.keys(o).length) delete S.years[y];
    save(); const sc=window.scrollY; render(); window.scrollTo(0,sc);
  }
  if(e.target.id==='importFile' && e.target.files[0]){
    const r=new FileReader(); r.onload=()=>{ try{ restoreFrom(JSON.parse(r.result)); save(); render(); toast('Back-up teruggezet'); }catch(err){ toast('Dit is geen geldig back-upbestand'); } }; r.readAsText(e.target.files[0]);
  }
});
let _justFocused=null;
document.addEventListener('focusin',e=>{ const t=e.target; if(!(t.classList&&t.classList.contains('gcell'))) return;
  if(t.dataset.calc && t.dataset.cat===UNDIST){ toast('"Niet verdeeld" is het maandtotaal min wat je over de categorieën hebt verdeeld.'); t.blur(); return; }
  if(t.dataset.calc){ const kind=t.dataset.kind||'uit', cat=t.dataset.cat, ym=t.dataset.ym, who=kind==='in'?S.settings.people.join(', ')+' of Samen':'de subcategorieën';
    toast(`Het totaal van ${cat} wordt berekend. Wijzig het bedrag bij ${who}.`);
    if(!gridOpen[kind+cat]){ gridOpen[kind+cat]=true; const sc=window.scrollY; render(); window.scrollTo(0,sc); }
    const first=[...document.querySelectorAll('.gcell')].find(x=>x.dataset.cat===cat&&x.dataset.ym===ym&&x.dataset.sub&&!x.dataset.calc&&x.value!=='');
    if(first){ first.focus({preventScroll:true}); } else t.blur(); return; }
  _justFocused=t; try{ t.select(); }catch(_){} });
document.addEventListener('mouseup',e=>{ if(_justFocused && e.target===_justFocused){ e.preventDefault(); try{ e.target.select(); }catch(_){} } _justFocused=null; });
document.addEventListener('keydown',e=>{ if(e.key==='Escape') closeModal();
  if((e.key==='PageUp'||e.key==='PageDown') && !$('#modalRoot').innerHTML && (view==='invoer'||view==='maand')){
    e.preventDefault(); const d=e.key==='PageUp'?-1:1; const ae=document.activeElement, key=ae&&ae.classList.contains('gcell')?[ae.dataset.cat,ae.dataset.sub]:null;
    if(ae&&ae.classList.contains('gcell')) ae.dispatchEvent(new Event('change',{bubbles:true}));
    if(view==='invoer'){ gridYm=iYm(ymI(invYm())+(invView==='jaar'?12*d:d)); invMode=null; } else selYm=iYm(ymI(selYm||curYm())+d);
    setTimeout(()=>{ render(); if(key&&invView!=='jaar'){ const el=[...document.querySelectorAll('.gcell')].find(x=>x.dataset.cat===key[0]&&x.dataset.sub===key[1]); if(el&&!el.disabled&&!el.dataset.calc){ el.focus(); el.select(); } } },0); return; }
  if(['ArrowUp','ArrowDown','Enter'].includes(e.key) && e.target.classList?.contains('gcell')){
    const t=e.target, cells=[...document.querySelectorAll(`.gcell[data-ym="${t.dataset.ym}"]`)].filter(x=>!x.disabled&&!x.dataset.calc), i=cells.indexOf(t), nx=cells[i+(e.key==='ArrowUp'?-1:1)];
    e.preventDefault(); if(nx) nx.focus(); else t.blur(); return; }
  if(e.key==='Enter'){ const t=e.target;
    if(t.classList?.contains('subnew')){ e.preventDefault(); addSub(t.dataset.cat,t.value); }
    else if(t.id==='newCat_uit'||t.id==='newCat_in'){ e.preventDefault(); document.querySelector(`[data-a=catAdd][data-kind="${t.id.slice(7)}"]`).click(); }
    else if(t.classList?.contains('catname')||t.classList?.contains('subname')||t.classList?.contains('pfield')||t.id==='anFrom'||t.id==='anTo'||t.id==='anYm'){ e.preventDefault(); t.blur(); } } });
window.addEventListener('hashchange',()=>{ closeModal(); render(); window.scrollTo(0,0); });

(()=>{ const tip=$('#tip');
  document.addEventListener('mousemove',e=>{ const t=e.target.closest&&e.target.closest('[data-tip]');
    if(!t){ tip.style.display='none'; return; } tip.textContent=t.getAttribute('data-tip'); tip.style.display='block';
    const w=tip.offsetWidth, h=tip.offsetHeight; let x=e.clientX+14, y=e.clientY+14; if(x+w>innerWidth-8) x=e.clientX-w-14; if(y+h>innerHeight-8) y=e.clientY-h-14; tip.style.left=x+'px'; tip.style.top=y+'px'; });
  document.addEventListener('scroll',()=>{ tip.style.display='none'; },true); })();
load(); render(); initDb();
</script>
